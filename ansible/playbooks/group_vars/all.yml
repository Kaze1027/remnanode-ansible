# 公共变量：所有节点共享，可在 inventory 主机条目中覆盖
node_image: ghcr.io/kaze1027/remnanode-ansible/remnanode:3.2.2   # 固定 3.2.2 版本镜像
node_port_default: 22222                                          # 默认节点端口，每台可用 node_port 覆盖
compose_dir: /opt/remnanode                                       # 节点上 compose 文件目录
watchtower_schedule: "0 0 4 * * *"                                # 每天 UTC 04:00（北京 12:00）检查更新

# ---- IPv6：新客户端 DynamicV6 Next / XepertV6 ----
# 说明：旧的 DynamicV6 客户端（manager + egress-picker）已退役，
#       现统一使用服务商新客户端，默认策略 leased（= 交互菜单第 2 项：自动挑选租约）。
dvn_script_url: "https://aethercloud.io/experimental-ipv6.sh"     # 新客户端脚本地址（旧 dynamicv6/client.sh 会 302 到此）
dvn_default: "leased"                                             # native | leased | <指定IPv6>
dvn_iface: eth0                                                   # 主网卡

# ---- 巡检通知（Telegram Bot）----
# 自行在 @BotFather 创建 bot，拿到 token；chat_id 可用 @userinfobot 或 getUpdates 获取（群组为负数）
telegram_bot_token: ""                                            # 例: 123456789:AAExxxxxxxxxxxxxxxxxxxxxxxxxxxx
telegram_chat_id: ""                                              # 例: 123456789 或 -1001234567890
dvn_quota_warn_pct: 85                                            # 周配额用量超过该百分比时告警
