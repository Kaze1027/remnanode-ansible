---
- name: Deploy remnanode nodes
  hosts: nodes
  become: true
  tasks:
    - name: Ensure curl is installed
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check if docker is installed
      ansible.builtin.command: command -v docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install docker via get.docker.com
      when: docker_check.rc != 0
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh

    # 时间同步 + 时钟看门狗
    # 原来的写法只装了 chrony 并 makestep 一次；Debian 默认 "makestep 1 3" 意味着
    # 之后的小时级跳变（VM 挂起/迁移）只能慢速 slew，会让节点卡死数天（SS2022 只容忍 ±30s）。
    - ansible.builtin.include_tasks: tasks/timesync.yml

    - name: Set timezone to Asia/Shanghai
      ansible.builtin.timezone:
        name: Asia/Shanghai

    # 部分 Debian 云主机创建后未把本地主机名写入 /etc/hosts，
    # 等价于: sudo sh -c 'grep -q "127.0.0.1 $(hostname)" /etc/hosts || echo "127.0.0.1 $(hostname)" >> /etc/hosts'
    - name: Ensure local hostname is present in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ ansible_hostname }}"
        create: true

    - name: Ensure compose directory exists
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory

    - name: Render docker-compose.yml from template
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_dir }}/docker-compose.yml"

    - name: Pull images and start containers
      ansible.builtin.shell:
        cmd: docker compose pull && docker compose up -d
        chdir: "{{ compose_dir }}"
