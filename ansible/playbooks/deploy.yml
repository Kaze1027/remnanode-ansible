---
- name: Deploy remnanode nodes
  hosts: nodes
  become: true
  tasks:
    - name: Ensure curl is installed
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check if docker is installed
      ansible.builtin.command: command -v docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install docker via get.docker.com
      when: docker_check.rc != 0
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh

    - name: Ensure chrony is installed
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start chrony
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started

    - name: Step system clock immediately
      ansible.builtin.command: chronyc makestep
      changed_when: false

    - name: Set timezone to Asia/Shanghai
      ansible.builtin.timezone:
        name: Asia/Shanghai

    - name: Ensure compose directory exists
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory

    - name: Render docker-compose.yml from template
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_dir }}/docker-compose.yml"

    - name: Pull images and start containers
      ansible.builtin.shell:
        cmd: docker compose pull && docker compose up -d
        chdir: "{{ compose_dir }}"
