---
# 部署 Aether 动态IPv6 容错方案到 nodes 组的所有节点
# 逻辑: 方案客户端脚本 + systemd override，用回退脚本保证"动态v6优先, 原生v6兜底"
# 用法（使用用户自己的 production.yml 清单，其 ansible_host 为域名如 us15.awso.cloud）:
#   ansible-playbook -i inventory/production.yml playbooks/dynamicv6-setup.yml            # 全量
#   ansible-playbook -i inventory/production.yml playbooks/dynamicv6-setup.yml --limit node-15  # 单台
- name: Deploy DynamicV6 fallback scheme to Aether nodes
  hosts: nodes
  become: true
  gather_facts: true
  vars:
    dynamicv6_bin_dir: "{{ dynamicv6_bin_dir | default('/usr/local/bin') }}"
    dynamicv6_state_file: "{{ dynamicv6_state_file | default('/var/lib/dynamicv6/client-eth0.state') }}"
    dynamicv6_iface: "{{ dynamicv6_iface | default('eth0') }}"
    dynamicv6_llgw: "{{ dynamicv6_llgw | default('') }}"
    dynamicv6_client_service: "dynamicv6-client.service"
    dynamicv6_client_timer: "dynamicv6-client.timer"
    dynamicv6_script_url: "https://billing.aethercloud.io/dynamicv6/client.sh"
  tasks:

    - name: Ensure curl and jq are installed
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - jq
      when: ansible_os_family is defined

    - name: Install/refresh Aether dynamicv6 client (idempotent)
      ansible.builtin.shell:
        cmd: |
          set -e
          if [ ! -x /usr/local/bin/dynamicv6-client.sh ]; then
            curl -fsSL {{ dynamicv6_script_url }} -o /usr/local/bin/dynamicv6-client.sh
            chmod +x /usr/local/bin/dynamicv6-client.sh
          fi
          # 用 SELECT_MODE=all 全选, 非交互式安装 systemd timer
          DYNAMICV6_SELECT_MODE=all DYNAMICV6_AUTO_TIMER=1 /usr/local/bin/dynamicv6-client.sh {{ dynamicv6_iface }}
        args:
          executable: /bin/bash
      register: client_install
      changed_when: client_install.stdout | length > 0

    - name: Ensure postprocess directory exists
      ansible.builtin.file:
        path: "{{ dynamicv6_bin_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy dynamicv6-postprocess.sh fallback script
      ansible.builtin.template:
        src: dynamicv6-postprocess.sh.j2
        dest: "{{ dynamicv6_bin_dir }}/dynamicv6-postprocess.sh"
        mode: "0755"
        owner: root
        group: root

    - name: Ensure service drop-in directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ dynamicv6_client_service }}.d"
        state: directory
        mode: "0755"

    - name: Deploy systemd override.conf
      ansible.builtin.template:
        src: dynamicv6-override.conf.j2
        dest: "/etc/systemd/system/{{ dynamicv6_client_service }}.d/override.conf"
        mode: "0644"
        owner: root
        group: root

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start DynamicV6 timer
      ansible.builtin.systemd:
        name: "{{ dynamicv6_client_timer }}"
        enabled: true
        state: started

    - name: Run postprocess manually now to apply fallback route immediately
      ansible.builtin.shell:
        cmd: "{{ dynamicv6_bin_dir }}/dynamicv6-postprocess.sh"
      register: post
      changed_when: true

    - name: Show applied default route
      ansible.builtin.debug:
        msg: "{{ post.stdout_lines | default([]) }}"
