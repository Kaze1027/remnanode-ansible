---
# ============================================================================
# ipquality-report.yml —— xykt/IPQuality IP 质量巡检（只报异常版）
#
# 默认「仅异常」：正常节点完全不推送，只列出现异常/非原生的节点：
#     ▎us34.awso.cloud
#     v4 · 162.251.204.47 · Oneman Network Limited · 美国 · 原生IP · ⚠️ AmazonPrime✘ ｜ 其余6项解锁（全部原生）
#
# 判定为「异常」的条件（满足其一即列出该节点）：
#     · 媒体出现 ✘（屏蔽）/ ✖（检测失败）
#     · 解锁方式含 DNS（=DNS，非原生解锁）
#     · IP 类型不是「原生IP」
#     · 采集失败（无输出 / JSON 解析失败）
#
# 用法（eb: /opt/remnanode-ansible/ansible）：
#   全并行（约 4 分钟）：
#     ansible-playbook -i inventory/production.yml playbooks/ipquality-report.yml -e ipq_serial=43 -f 43
#   只跑几台（调试）：
#     ... --limit node-01,node-16,node-34
#   只重排版不重采集（约 1.5 分钟）：
#     ... -e ipq_reuse=1
#   输出全部节点（含正常）+ 逐项解锁方式：
#     ... -e ipq_alerts_only=0 -e ipq_media_detail=1
# ============================================================================
- name: Collect IP quality per node (xykt/IPQuality)
  hosts: nodes
  become: true
  gather_facts: false
  serial: "{{ ipq_serial | default(6) | int }}"
  vars:
    ipq_url: "https://IP.Check.Place"
    ipq_raw: /tmp/ipq-raw.json
    ipq_dir: /var/lib/ipquality
    ipq_parser: /usr/local/bin/ipq-parse.py
    ipq_flags: "{{ ipq_cli_flags | default('-f -n -p -j') }}"
    ipq_pkgs:
      - curl
      - jq
      - bc
      - netcat-openbsd
      - dnsutils
      - iproute2
      - ca-certificates
  tasks:
    - name: 跳过非 Aether 主机
      ansible.builtin.meta: end_host
      when: not (dvn_managed | default(true) | bool)

    - name: 部署解析器
      ansible.builtin.copy:
        src: files/ipq-parse.py
        dest: "{{ ipq_parser }}"
        mode: "0755"

    - name: 确保数据目录
      ansible.builtin.file:
        path: "{{ ipq_dir }}"
        state: directory
        mode: "0755"

    - name: 检查依赖是否齐全
      ansible.builtin.shell: >-
        dpkg-query -W -f='${Status}\n' {{ ipq_pkgs | join(' ') }} 2>/dev/null
        | grep -c 'install ok installed' || true
      args:
        executable: /bin/bash
      register: ipq_deps
      changed_when: false
      failed_when: false

    - name: 安装缺失依赖（仅缺失时）
      ansible.builtin.apt:
        name: "{{ ipq_pkgs }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: (ipq_deps.stdout | default('0') | trim | int) < (ipq_pkgs | length)

    - name: 确保 IPQuality 脚本就位（缺失时才下载）
      ansible.builtin.shell: |
        if [ ! -s /usr/local/bin/ipq.sh ]; then
          curl -Ls --max-time 60 "{{ ipq_url }}" -o /usr/local/bin/ipq.sh
        fi
        chmod 755 /usr/local/bin/ipq.sh
        echo "script_bytes=$(wc -c < /usr/local/bin/ipq.sh)"
      args:
        executable: /bin/bash
      register: ipq_dl
      changed_when: false
      failed_when: false

    - name: 运行 IPQuality（异步，最长 20 分钟）
      ansible.builtin.shell: |
        timeout 900 bash /usr/local/bin/ipq.sh {{ ipq_flags }} > {{ ipq_raw }} 2>{{ ipq_dir }}/latest.err || true
        if [ ! -s {{ ipq_raw }} ]; then
          echo "NO_OUTPUT err=$(tail -c 300 {{ ipq_dir }}/latest.err | tr '\n' ' ')"
          exit 1
        fi
        cp -f {{ ipq_raw }} {{ ipq_dir }}/latest.json
        echo "bytes=$(wc -c < {{ ipq_raw }})"
      args:
        executable: /bin/bash
      register: ipq_run
      async: 1200
      poll: 15
      changed_when: false
      failed_when: false
      when: not (ipq_reuse | default(0) | bool)

    - name: 解析为可读分行文本（默认仅异常）
      ansible.builtin.shell: >-
        python3 {{ ipq_parser }}
        {{ (ipq_dir ~ '/latest.json') if (ipq_reuse | default(0) | bool) else ipq_raw }}
        '{{ ansible_host | default(inventory_hostname) }}'
        {{ 'detail' if (ipq_media_detail | default(0) | bool) else '' }}
        {{ 'alerts-only' if (ipq_alerts_only | default(1) | bool) else '' }}
      register: ipq_lines
      changed_when: false
      failed_when: false

    - name: 采集结果
      ansible.builtin.debug:
        msg: "{{ ipq_run.stdout | default('(no stdout)') }}"

- name: Aggregate and notify Telegram
  hosts: localhost
  gather_facts: false
  vars:
    chunk_nodes: "{{ ipq_chunk | default(10) | int }}"
    tg_enabled: "{{ ipq_notify | default(1) | int }}"
    tg_token: "{{ telegram_bot_token | default('') }}"
    tg_chat: "{{ telegram_chat_id | default('') }}"
    alerts_only: "{{ ipq_alerts_only | default(1) | int }}"
  tasks:
    - name: 汇总异常节点文本块（正常节点为空，自动排除）
      ansible.builtin.set_fact:
        ipq_blocks: "{{ groups['nodes'] | map('extract', hostvars, 'ipq_lines') | select('defined') | map(attribute='stdout_lines') | select('truthy') | list }}"

    - name: 统计扫描 / 异常台数
      ansible.builtin.set_fact:
        ipq_scanned: "{{ groups['nodes'] | map('extract', hostvars, 'ipq_lines') | select('defined') | list | length }}"
        ipq_hosts: "{{ groups['nodes'] | map('extract', hostvars, 'ipq_lines') | select('defined') | map(attribute='stdout_lines') | select('truthy') | list | length }}"

    - name: 汇总头
      ansible.builtin.set_fact:
        ipq_header: "{{ lookup('template', 'ipq-header.j2') }}"

    - name: 组装分片
      ansible.builtin.set_fact:
        ipq_chunks: "{{ (ipq_blocks | batch(chunk_nodes)) | list }}"

    - name: 控制台输出
      ansible.builtin.debug:
        msg: "{{ [ipq_header] + (ipq_blocks | flatten) }}"

    - name: 异常清单推送 Telegram（分片）
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ tg_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ tg_chat }}"
          text: "{{ (ipq_header ~ '\n\n' if idx == 0 else '') ~ (item | map('join', '\n') | join('\n\n')) }}"
          disable_web_page_preview: true
        status_code: 200
        timeout: 20
      loop: "{{ ipq_chunks }}"
      loop_control:
        index_var: idx
        pause: 1
      when:
        - tg_enabled | int == 1
        - tg_token | length > 0
        - tg_chat | length > 0
        - ipq_blocks | length > 0
      no_log: true
      ignore_errors: true
      register: ipq_tg

    - name: 全部正常时的一条通知
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ tg_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ tg_chat }}"
          text: "{{ ipq_header }}"
          disable_web_page_preview: true
        status_code: 200
        timeout: 20
      when:
        - tg_enabled | int == 1
        - tg_token | length > 0
        - tg_chat | length > 0
        - ipq_blocks | length == 0
      no_log: true
      ignore_errors: true
      register: ipq_tg_ok

    - name: 推送结果
      ansible.builtin.debug:
        msg:
          - "扫描 {{ ipq_scanned }} 台 · 异常 {{ ipq_hosts }} 台 · 正常 {{ (ipq_scanned | int) - (ipq_hosts | int) }} 台"
          - "模式: {{ '仅异常' if alerts_only | int == 1 else '全部节点' }} ｜ 明细: {{ '逐项解锁方式' if (ipq_media_detail | default(0) | bool) else '紧凑' }}"
          - "Telegram 分片: {{ ipq_chunks | length }} 片 ｜ HTTP: {{ (ipq_tg.results | default([]) | selectattr('status', 'defined') | map(attribute='status') | list) if (ipq_tg is defined and ipq_tg.results is defined) else 'skipped' }}"
