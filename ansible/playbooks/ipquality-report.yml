---
# ============================================================================
# ipquality-report.yml —— xykt/IPQuality IP 质量巡检（只报异常版）
#
# 默认「仅异常」：正常节点完全不推送，只列出现异常/非原生的节点：
#     ▎us34.awso.cloud
#     v4 · 162.251.204.47 · Oneman Network Limited · 美国 · 原生IP · ⚠️ AmazonPrime✘ ｜ 其余6项解锁（全部原生）
#
# 判定为「异常」的条件（满足其一即列出该节点）：
#     · 媒体出现 ✘（屏蔽）/ ✖（检测失败）
#     · 解锁方式含 DNS（=DNS，非原生解锁）
#     · IP 类型不是「原生IP」
#     · 采集失败（无输出 / JSON 解析失败）
#
# 用法（eb: /opt/remnanode-ansible/ansible）：
#   全并行（约 4 分钟）：
#     ansible-playbook -i inventory/production.yml playbooks/ipquality-report.yml -e ipq_serial=43 -f 43
#   只跑几台（调试）：
#     ... --limit node-01,node-16,node-34
#   只重排版不重采集（约 1.5 分钟）：
#     ... -e ipq_reuse=1
#   输出全部节点（含正常）+ 逐项解锁方式：
#     ... -e ipq_alerts_only=0 -e ipq_media_detail=1
# ============================================================================
- name: Collect IP quality per node (xykt/IPQuality)
  hosts: nodes
  become: true
  gather_facts: false
  serial: "{{ ipq_serial | default('100%') }}"
  vars:
    ipq_url: "https://IP.Check.Place"
    ipq_raw: /tmp/ipq-raw.json
    ipq_dir: /var/lib/ipquality
    ipq_parser: /usr/local/bin/ipq-parse.py
    ipq_wiki_file: /tmp/ipq-wiki.txt
    ipq_client_file: /tmp/ipq-client.txt
    ipq_probe_urls: "https://one.one.one.one/cdn-cgi/trace https://api6.ipify.org https://v6.ipinfo.io/ip"
    dvn_quota_warn: "{{ dvn_quota_warn_pct | default(85) | int }}"
    ipq_flags: "{{ ipq_cli_flags | default('-f -n -p -j') }}"
    ipq_pkgs:
      - curl
      - jq
      - bc
      - netcat-openbsd
      - dnsutils
      - iproute2
      - ca-certificates
  tasks:
    - name: 跳过非 Aether 主机
      ansible.builtin.meta: end_host
      when: not (dvn_managed | default(true) | bool)

    - name: 部署解析器
      ansible.builtin.copy:
        src: files/ipq-parse.py
        dest: "{{ ipq_parser }}"
        mode: "0755"

    - name: 确保数据目录
      ansible.builtin.file:
        path: "{{ ipq_dir }}"
        state: directory
        mode: "0755"

    - name: 检查依赖是否齐全
      ansible.builtin.shell: >-
        dpkg-query -W -f='${Status}\n' {{ ipq_pkgs | join(' ') }} 2>/dev/null
        | grep -c 'install ok installed' || true
      args:
        executable: /bin/bash
      register: ipq_deps
      changed_when: false
      failed_when: false

    - name: 安装缺失依赖（仅缺失时）
      ansible.builtin.apt:
        name: "{{ ipq_pkgs }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: (ipq_deps.stdout | default('0') | trim | int) < (ipq_pkgs | length)

    - name: 确保 IPQuality 脚本就位（缺失时才下载）
      ansible.builtin.shell: |
        if [ ! -s /usr/local/bin/ipq.sh ]; then
          curl -Ls --max-time 60 "{{ ipq_url }}" -o /usr/local/bin/ipq.sh
        fi
        chmod 755 /usr/local/bin/ipq.sh
        echo "script_bytes=$(wc -c < /usr/local/bin/ipq.sh)"
      args:
        executable: /bin/bash
      register: ipq_dl
      changed_when: false
      failed_when: false

    - name: 运行 IPQuality（异步，最长 20 分钟）
      ansible.builtin.shell: |
        timeout 900 bash /usr/local/bin/ipq.sh {{ ipq_flags }} > {{ ipq_raw }} 2>{{ ipq_dir }}/latest.err || true
        if [ ! -s {{ ipq_raw }} ]; then
          echo "NO_OUTPUT err=$(tail -c 300 {{ ipq_dir }}/latest.err | tr '\n' ' ')"
          exit 1
        fi
        cp -f {{ ipq_raw }} {{ ipq_dir }}/latest.json
        echo "bytes=$(wc -c < {{ ipq_raw }})"
      args:
        executable: /bin/bash
      register: ipq_run
      changed_when: false
      failed_when: false
      when: not (ipq_reuse | default(0) | bool)

    - name: 部署维基可编辑性检测脚本（并入解锁报告）
      ansible.builtin.copy:
        src: files/wiki-edit-check.sh
        dest: /usr/local/bin/wiki-edit-check.sh
        mode: "0755"

    - name: DynamicV6 Next 客户端状态（一行摘要，含服务/出口/默认路由/metric99/配额/sync）
      ansible.builtin.shell: |
        SVC=$(systemctl is-active dynamicv6-next-guest.service 2>/dev/null || echo inactive)
        [ -s /tmp/dvn.sh ] || curl -4 -fsSL --max-time 25 "{{ dvn_script_url | default('https://aethercloud.io/experimental-ipv6.sh') }}" -o /tmp/dvn.sh 2>/dev/null
        JS=$(bash /tmp/dvn.sh status --json 2>/dev/null)
        PREF=$(printf '%s' "$JS" | jq -r '.default_preference // "?"' 2>/dev/null)
        OUT=$(printf '%s' "$JS" | jq -r '.outbound_ipv6 // "none"' 2>/dev/null)
        PCT=$(printf '%s' "$JS" | jq -r 'if (.usage.limit_bytes // 0) > 0 then (((.usage.charged_bytes // 0) * 100 / .usage.limit_bytes) | floor) else -1 end' 2>/dev/null)
        M99=$(ip -6 route show default | grep -c 'metric 99' || true)
        HEALTH=FAIL
        for u in {{ ipq_probe_urls }}; do
          curl -6 -fsS --noproxy '*' --connect-timeout 3 --max-time 5 "$u" >/dev/null 2>&1 && { HEALTH=OK; break; }
        done
        SF=$(journalctl -u dynamicv6-next-guest.service --since '15 min ago' --no-pager 2>/dev/null | grep -c 'sync failed' || true)
        BAD=()
        [ "$SVC" != "active" ] && BAD+=("服务=$SVC")
        [ "$HEALTH" != "OK" ] && BAD+=("出口不可达")
        [ "$PREF" != "leased" ] && BAD+=("默认=$PREF")
        [ "${M99:-0}" -lt 1 ] && BAD+=("缺 metric99")
        [ "${PCT:--1}" -ge {{ dvn_quota_warn }} ] && BAD+=("配额 ${PCT}%")
        [ "${SF:-0}" -gt 3 ] && BAD+=("sync失败 ${SF}")
        BADS=""
        for b in "${BAD[@]}"; do BADS="${BADS}${BADS:+ · }$b"; done
        if [ -n "$BADS" ]; then
          printf '⚠️ %s\n' "$BADS" > {{ ipq_client_file }}
        else
          printf '✅ %s 用量%s%% sf%s\n' "$PREF" "${PCT:--1}" "$SF" > {{ ipq_client_file }}
        fi
        cat {{ ipq_client_file }}
      args:
        executable: /bin/bash
      register: ipq_client
      changed_when: false
      failed_when: false

    - name: 维基百科可编辑性（v4 优先；v4 不可用才测 v6）
      ansible.builtin.shell: |
        /usr/local/bin/wiki-edit-check.sh --summary --prefer-v4 2>/dev/null | iconv -f UTF-8 -t UTF-8 -c > {{ ipq_wiki_file }} || true
        iconv -f UTF-8 -t UTF-8 -c < {{ ipq_wiki_file }}
      register: ipq_wiki
      changed_when: false
      failed_when: false

    - name: 解析为可读分行文本（默认仅异常）
      ansible.builtin.shell: >-
        python3 {{ ipq_parser }}
        {{ (ipq_dir ~ '/latest.json') if (ipq_reuse | default(0) | bool) else ipq_raw }}
        '{{ ansible_host | default(inventory_hostname) }}'
        {{ 'detail' if (ipq_media_detail | default(0) | bool) else '' }}
        {{ 'alerts-only' if (ipq_alerts_only | default(1) | bool) else '' }}
        {{ 'show-dns' if (ipq_show_dns | default(0) | bool) else '' }}
        --wiki {{ ipq_wiki_file }}
        --client {{ ipq_client_file }}
        | iconv -f UTF-8 -t UTF-8 -c
      register: ipq_lines
      changed_when: false
      failed_when: false

    - name: 采集结果
      ansible.builtin.debug:
        msg: "{{ ipq_run.stdout | default('(no stdout)') }} ｜ {{ ipq_client.stdout | default('') | trim }} ｜ {{ ipq_wiki.stdout | default('') | trim }}"

- name: Aggregate and notify Telegram
  hosts: localhost
  gather_facts: false
  vars:
    chunk_nodes: "{{ ipq_chunk | default(10) | int }}"
    tg_enabled: "{{ ipq_notify | default(1) | int }}"
    tg_token: "{{ telegram_bot_token | default('') }}"
    tg_chat: "{{ telegram_chat_id | default('') }}"
    alerts_only: "{{ ipq_alerts_only | default(1) | int }}"
    nl: "\n"
  tasks:
    - name: 汇总异常节点文本块（正常节点为空，自动排除）
      ansible.builtin.set_fact:
        ipq_blocks: "{{ groups['nodes'] | map('extract', hostvars, 'ipq_lines') | select('defined') | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | select('truthy') | list }}"

    - name: 统计扫描 / 异常台数
      ansible.builtin.set_fact:
        ipq_scanned: "{{ groups['nodes'] | map('extract', hostvars, 'ipq_lines') | select('defined') | selectattr('stdout_lines', 'defined') | list | length }}"
        ipq_hosts: "{{ ipq_blocks | length }}"

    - name: 统计客户端异常 / 维基汇总（v4、v6 不可编辑台数与常见原因）
      ansible.builtin.set_fact:
        ipq_flat_lines: "{{ ipq_blocks | flatten | list }}"
        ipq_client_bad: "{{ ipq_blocks | flatten | select('search', '🧩⚠️') | list | length }}"
        ipq_wiki_lines: "{{ groups['nodes'] | map('extract', hostvars, 'ipq_wiki') | select('defined') | selectattr('stdout', 'defined') | map(attribute='stdout') | map('trim') | select('truthy') | list }}"

    - name: 维基计数（v4 优先口径）
      ansible.builtin.set_fact:
        ipq_wiki_v4_ok: "{{ ipq_wiki_lines | select('search', 'v4 ✅') | list | length }}"
        ipq_wiki_bad: "{{ ipq_wiki_lines | select('search', 'v4 ⛔') | list | length }}"
        ipq_wiki_v4_bad: "{{ ipq_wiki_lines | select('search', 'v4 ⛔') | select('search', 'v6 ⛔') | list | length }}"
        ipq_wiki_reason: "{{ (ipq_wiki_lines | select('search', 'v4 ⛔') | map('regex_replace', '^.*v4 ⛔ ', '') | map('regex_replace', ' · .*$', '') | list | unique | first) | default('') }}"

    - name: 汇总头
      ansible.builtin.set_fact:
        ipq_header: "{{ lookup('template', 'ipq-header.j2') }}"

    - name: 组装分片
      ansible.builtin.set_fact:
        ipq_chunks: "{{ (ipq_blocks | batch(chunk_nodes)) | list }}"

    - name: 控制台输出
      ansible.builtin.debug:
        msg: "{{ [ipq_header] + (ipq_blocks | flatten) }}"

    - name: 推送汇总（第 1 条，始终发送）
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ tg_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ tg_chat }}"
          parse_mode: HTML
          text: "{{ ipq_header | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') }}"
          disable_web_page_preview: true
        status_code: 200
        timeout: 20
      when:
        - tg_enabled | int == 1
        - tg_token | length > 0
        - tg_chat | length > 0
      no_log: true
      ignore_errors: true
      register: ipq_tg_head

    - name: 推送明细（分片，默认折叠，点击展开）
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ tg_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ tg_chat }}"
          parse_mode: HTML
          text: >-
            ⚠️ 异常明细 {{ idx + 1 }}/{{ ipq_chunks | length }}（点击展开）{{ nl }}<blockquote expandable>{{ (item | map('join', nl) | join(nl ~ nl))
              | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') }}</blockquote>
          disable_web_page_preview: true
        status_code: 200
        timeout: 20
      loop: "{{ ipq_chunks }}"
      loop_control:
        index_var: idx
        pause: 1
      when:
        - tg_enabled | int == 1
        - tg_token | length > 0
        - tg_chat | length > 0
        - ipq_blocks | length > 0
      no_log: true
      ignore_errors: true
      register: ipq_tg

    - name: 推送结果
      ansible.builtin.debug:
        msg:
          - "扫描 {{ ipq_scanned }} 台 · 异常 {{ ipq_hosts }} 台 · 正常 {{ (ipq_scanned | int) - (ipq_hosts | int) }} 台"
          - "模式: {{ '仅异常' if alerts_only | int == 1 else '全部节点' }} ｜ 明细: {{ '逐项解锁方式' if (ipq_media_detail | default(0) | bool) else '紧凑' }}"
          - "Telegram 汇总: {{ (ipq_tg_head.status | default('skipped')) }} ｜ 明细分片: {{ ipq_chunks | length }} 片 ｜ HTTP: {{ (ipq_tg.results | default([]) | selectattr('status', 'defined') | map(attribute='status') | list) if (ipq_tg is defined and ipq_tg.results is defined) else 'skipped' }}"
