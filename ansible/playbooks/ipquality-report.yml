---
# ============================================================================
# ipquality-report.yml —— xykt/IPQuality IP 质量巡检（可读版推送）
#
# 每台节点输出可读文本（由 files/ipq-parse.py 生成）：
#     ▎us1.awso.cloud
#     v4 · 23.147.120.204 · TAIPEI101 NETWORK LLC · 美国·North Kansas City · 原生IP · ✅ 全解锁（7/7）
#     v6 · 2600:1700:2bc1:409d:8::f80d · AT&T Enterprises, LLC · …·Warrenville · 原生IP · ⚠️ TikTok✖ Prime✘
# 消息按「每片 8 台节点」切分，首片带汇总统计。
#
# 用法（eb: /opt/remnanode-ansible/ansible）：
#   全并行（推荐，约 4 分钟）：
#     ansible-playbook -i inventory/production.yml playbooks/ipquality-report.yml -e ipq_serial=43 -f 43
#   保守（默认 serial=6）：直接跑
#   单台 / 不发 TG：  --limit node-18 -e ipq_notify=0
#   只看 IPv4：       -e ipq_cli_flags='-4 -f -n -p -j'
# ============================================================================
- name: Collect IP quality per node (xykt/IPQuality)
  hosts: nodes
  become: true
  gather_facts: false
  serial: "{{ ipq_serial | default(6) | int }}"
  vars:
    ipq_url: "https://IP.Check.Place"
    ipq_raw: /tmp/ipq-raw.json
    ipq_dir: /var/lib/ipquality
    ipq_parser: /usr/local/bin/ipq-parse.py
    ipq_flags: "{{ ipq_cli_flags | default('-f -n -p -j') }}"
    ipq_pkgs:
      - curl
      - jq
      - bc
      - netcat-openbsd
      - dnsutils
      - iproute2
      - ca-certificates
  tasks:
    - name: 跳过非 Aether 主机
      ansible.builtin.meta: end_host
      when: not (dvn_managed | default(true) | bool)

    - name: 部署解析器
      ansible.builtin.copy:
        src: files/ipq-parse.py
        dest: "{{ ipq_parser }}"
        mode: "0755"

    - name: 确保数据目录
      ansible.builtin.file:
        path: "{{ ipq_dir }}"
        state: directory
        mode: "0755"

    - name: 检查依赖是否齐全
      ansible.builtin.shell: >-
        dpkg-query -W -f='${Status}\n' {{ ipq_pkgs | join(' ') }} 2>/dev/null
        | grep -c 'install ok installed' || true
      args:
        executable: /bin/bash
      register: ipq_deps
      changed_when: false
      failed_when: false

    - name: 安装缺失依赖（仅缺失时）
      ansible.builtin.apt:
        name: "{{ ipq_pkgs }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: (ipq_deps.stdout | default('0') | trim | int) < (ipq_pkgs | length)

    - name: 确保 IPQuality 脚本就位（缺失时才下载）
      ansible.builtin.shell: |
        if [ ! -s /usr/local/bin/ipq.sh ]; then
          curl -Ls --max-time 60 "{{ ipq_url }}" -o /usr/local/bin/ipq.sh
        fi
        chmod 755 /usr/local/bin/ipq.sh
        echo "script_bytes=$(wc -c < /usr/local/bin/ipq.sh)"
      args:
        executable: /bin/bash
      register: ipq_dl
      changed_when: false
      failed_when: false

    - name: 运行 IPQuality（异步，最长 20 分钟）
      ansible.builtin.shell: |
        timeout 900 bash /usr/local/bin/ipq.sh {{ ipq_flags }} > {{ ipq_raw }} 2>{{ ipq_dir }}/latest.err || true
        if [ ! -s {{ ipq_raw }} ]; then
          echo "NO_OUTPUT err=$(tail -c 300 {{ ipq_dir }}/latest.err | tr '\n' ' ')"
          exit 1
        fi
        cp -f {{ ipq_raw }} {{ ipq_dir }}/latest.json
        echo "bytes=$(wc -c < {{ ipq_raw }})"
      args:
        executable: /bin/bash
      register: ipq_run
      async: 1200
      poll: 15
      changed_when: false
      failed_when: false
      when: not (ipq_reuse | default(0) | bool)

    - name: 解析为可读分行文本
      ansible.builtin.shell: >-
        python3 {{ ipq_parser }}
        {{ (ipq_dir ~ '/latest.json') if (ipq_reuse | default(0) | bool) else ipq_raw }}
        '{{ ansible_host | default(inventory_hostname) }}'
        {{ 'detail' if (ipq_media_detail | default(0) | bool) else '' }}
      register: ipq_lines
      changed_when: false
      failed_when: false

    - name: 采集结果
      ansible.builtin.debug:
        msg: "{{ ipq_run.stdout | default('(no stdout)') }}"

- name: Aggregate and notify Telegram
  hosts: localhost
  gather_facts: false
  vars:
    chunk_nodes: "{{ ipq_chunk | default(8) | int }}"
    tg_enabled: "{{ ipq_notify | default(1) | int }}"
    tg_token: "{{ telegram_bot_token | default('') }}"
    tg_chat: "{{ telegram_chat_id | default('') }}"
  tasks:
    - name: 汇总每台节点的文本块
      ansible.builtin.set_fact:
        ipq_blocks: "{{ groups['nodes'] | map('extract', hostvars, 'ipq_lines') | select('defined') | map(attribute='stdout_lines') | select('truthy') | list }}"

    - name: 展平并统计
      ansible.builtin.set_fact:
        ipq_flat: "{{ ipq_blocks | flatten | list }}"
        ipq_hosts: "{{ ipq_blocks | length }}"

    - name: 按族归类
      ansible.builtin.set_fact:
        ipq_ip_lines: "{{ ipq_flat | select('match', '^v[46] · ') | list }}"
        ipq_v4_lines: "{{ ipq_flat | select('match', '^v4 · ') | list }}"
        ipq_v6_lines: "{{ ipq_flat | select('match', '^v6 · ') | list }}"

    - name: 汇总头
      ansible.builtin.set_fact:
        ipq_header: "{{ lookup('template', 'ipq-header.j2') }}"

    - name: 组装分片（每片 8 台节点）
      ansible.builtin.set_fact:
        ipq_chunks: "{{ (ipq_blocks | batch(chunk_nodes)) | list }}"

    - name: 控制台输出
      ansible.builtin.debug:
        msg: "{{ [ipq_header] + ipq_flat }}"

    - name: 推送 Telegram（分片）
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ tg_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ tg_chat }}"
          text: "{{ (ipq_header ~ '\n\n' if idx == 0 else '') ~ (item | map('join', '\n') | join('\n\n')) }}"
          disable_web_page_preview: true
        status_code: 200
        timeout: 20
      loop: "{{ ipq_chunks }}"
      loop_control:
        index_var: idx
        pause: 1
      when:
        - tg_enabled | int == 1
        - tg_token | length > 0
        - tg_chat | length > 0
      no_log: true
      ignore_errors: true
      register: ipq_tg

    - name: 收集需关注项（v4 媒体异常 / 非原生IP / 采集失败）
      ansible.builtin.set_fact:
        ipq_alerts: "{{ (ipq_v4_lines | select('search', '[✘✖]') | list) + (ipq_ip_lines | reject('search', '原生IP') | list) + (ipq_flat | select('search', '采集失败') | list) }}"

    - name: 推送“需关注”清单
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ tg_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ tg_chat }}"
          text: "⚠️ 需关注（v4 媒体异常 / 非原生IP / 采集失败）\n\n{{ ipq_alerts | join('\n') }}"
          disable_web_page_preview: true
        status_code: 200
        timeout: 20
      when:
        - tg_enabled | int == 1
        - tg_token | length > 0
        - tg_chat | length > 0
        - ipq_alerts | length > 0
      no_log: true
      ignore_errors: true
      register: ipq_tg_alert

    - name: 推送结果
      ansible.builtin.debug:
        msg:
          - "节点 {{ ipq_hosts }} 台 · IP 记录 {{ ipq_ip_lines | length }} 条"
          - "非原生IP: {{ ipq_ip_lines | reject('search', '原生IP') | list | length }} 条"
          - "媒体异常: v4 {{ ipq_v4_lines | select('search', '[✘✖]') | list | length }} 条 / v6 {{ ipq_v6_lines | select('search', '[✘✖]') | list | length }} 条"
          - "需关注清单: {{ ipq_alerts | length }} 条"
          - "Telegram 分片: {{ ipq_chunks | length }} 片 ｜ HTTP: {{ (ipq_tg.results | default([]) | selectattr('status', 'defined') | map(attribute='status') | list) if (ipq_tg is defined and ipq_tg.results is defined) else 'skipped' }}"
