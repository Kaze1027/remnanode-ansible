[defaults]
forks = 20
timeout = 60
inventory = inventory/production.yml
host_key_checking = False
interpreter_python = auto_silent
remote_user = root
private_key_file = ~/.ssh/id_ed25519

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o TCPKeepAlive=yes
pipelining = True
